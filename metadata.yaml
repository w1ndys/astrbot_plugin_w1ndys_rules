name: astrbot_plugin_w1ndys_rules
display_name: 群规
short_desc: 按群管理关键词回复和违禁规则，违禁判断仅在触发后调用模型
desc: |
  AstrBot 插件：群里的固定规则。关键词回复由代码确定性匹配；违禁词先由代码
  匹配本群触发词，命中后才让当前模型按固定准则和本群样本回答是或否。

  目标平台是 NapCat / Lagrange / LLOneBot 等 OneBot v11 协议端。

  关键词回复：
  - 群员发一条消息，内容与某个关键词完全相同，机器人就回预设内容；
  - 不 @ 机器人、不唤醒，照样回复，也不会触发模型；
  - 每个群的开关默认关闭，需要管理员在群里发 关键词 开 打开，不用带唤醒前缀；
  - 管理员可以用自然语言增删改查关键词，这条要带唤醒前缀，因为要进模型；
  - 一次贴很多条用 关键词 批量，不经过模型，也不用带前缀；一行一条，用 | 分开关键词和回复，已有的报冲突不覆盖。

  违禁词：
  - 管理员在群里发 违禁词 开 / 违禁词 关，不用带唤醒前缀；
  - 触发词和违禁样本按群存入 SQLite，通过 Agent 自然语言工具增删改查；
  - 判断准则、提醒文案、禁言时间和飞书 Webhook 仍由 WebUI 配置；
  - 只有代码命中触发词且模型整句回答是，才撤回、禁言并提醒。

  注意：关键词不能以唤醒前缀开头。AstrBot 会把唤醒前缀从消息开头剥掉，
  这类关键词永远匹配不到，写入时会被拦下并说明原因。

  欢迎语和其它群规能力仍在开发中。
version: 0.4.0
author: w1ndys
repo: https://github.com/w1ndys/astrbot_plugin_w1ndys_rules
astrbot_version: ">=4.13"
support_platforms:
  - aiocqhttp
