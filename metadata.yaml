name: astrbot_plugin_w1ndys_rules
display_name: 群规
short_desc: 关键词、违禁词、欢迎语、黑名单，全部走代码匹配，不经过模型
desc: |
  AstrBot 插件：群里的固定规则。命中判断全部由代码完成，不调用大模型，
  所以不消耗 Token，也不会因为模型发挥而回错内容。

  目标平台是 NapCat / Lagrange / LLOneBot 等 OneBot v11 协议端。

  当前版本只包含关键词回复：
  - 群员发一条消息，内容与某个关键词完全相同，机器人就回预设内容；
  - 不 @ 机器人、不唤醒，照样回复，也不会触发模型；
  - 每个群的开关默认关闭，需要管理员执行 关键词 开 打开；
  - 管理员可以直接用自然语言增删改查关键词，不需要记指令格式；
  - 一次贴很多条用 关键词 批量，不经过模型；一行一条，用 | 分开关键词和回复，已有的报冲突不覆盖。

  注意：关键词不能以唤醒前缀开头。AstrBot 会把唤醒前缀从消息开头剥掉，
  这类关键词永远匹配不到，写入时会被拦下并说明原因。

  后续版本会在同一个包内加入违禁词、欢迎语、黑名单等功能。
  群管动作（禁言、踢人、改名片）由 astrbot_plugin_group_agent 负责，本插件不做。
version: 0.3.0
author: w1ndys
repo: https://github.com/w1ndys/astrbot_plugin_w1ndys_rules
astrbot_version: ">=4.13"
support_platforms:
  - aiocqhttp
