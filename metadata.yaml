name: astrbot_plugin_w1ndys_rules
display_name: 群规
short_desc: 按群管理关键词回复、欢迎语、入群验证和邀请树；违禁触发词全局共用，判断仅在触发后调用模型
desc: |
  AstrBot 插件：群里的固定规则。关键词回复、欢迎语、入群验证、邀请树由代码处理；
  违禁词先由代码匹配全局触发词，命中后才让当前模型按固定准则和 WebUI 样本回答是或否。
  入群验证私聊交码，白天每 2 小时提醒，不踢人。

  目标平台是 NapCat / Lagrange / LLOneBot 等 OneBot v11 协议端。

  关键词回复：
  - 群员发一条消息，内容与某个关键词完全相同，机器人就回预设内容；
  - 不 @ 机器人、不唤醒，照样回复，也不会触发模型；
  - 每个群的开关默认关闭，需要管理员在群里发 关键词 开 打开，不用带唤醒前缀；
  - 管理员可以用自然语言增删改查关键词，这条要带唤醒前缀，因为要进模型；
  - 一次贴很多条用 关键词 批量，不经过模型，也不用带前缀；一行一条，用 | 分开关键词和回复，已有的报冲突不覆盖。

  违禁词：
  - 管理员在群里发 违禁词 开 / 违禁词 关，不用带唤醒前缀；
  - 触发词全局存入 SQLite，在群里用自然语言增删改查，对所有群生效；
  - 判断准则、违禁样本、提醒文案、禁言时间和飞书 Webhook 由 WebUI 配置；
  - 只有代码命中触发词且模型整句回答是，才撤回、禁言并提醒。

  注意：关键词不能以唤醒前缀开头。AstrBot 会把唤醒前缀从消息开头剥掉，
  这类关键词永远匹配不到，写入时会被拦下并说明原因。

  欢迎语：
  - 管理员在群里发 欢迎语 开 / 欢迎语 关，不用带唤醒前缀；
  - 欢迎语 设置 文案；整句发 欢迎语 查看当前文案；
  - 打开后入群会发送文案；和入群验证同时开时分开发，通过后只撤回验证说明。

  入群验证：
  - 管理员在群里发 入群验证 开 / 入群验证 关，不用带唤醒前缀；
  - 打开后入群立刻禁言 30 天，群里单独发验证码，要求私聊机器人交码；
  - 私聊带码即通过：撤回提示、解禁、私聊告知通过；对不上私聊回验证码不对；群里发码不算；
  - 仍 pending 时白天每 2 小时换新码再提醒（北京时间 8 点到 22 点），夜里不发；
  - 群消息仍先走违禁词，待验证的人发广告也会撤回；
  - 管理员可扫描、通过、拒绝，拒绝不踢人；退群清 pending，其他管理员解禁视为通过。

  邀请树：
  - 管理员在群里发 邀请树 开 / 邀请树 关，不用带唤醒前缀；
  - 打开后入群记邀请边；退群不删，再进覆盖；
  - 管理员带唤醒前缀后可查上线链和整条下线。
version: 0.4.2
author: w1ndys
repo: https://github.com/w1ndys/astrbot_plugin_w1ndys_rules
astrbot_version: ">=4.13"
support_platforms:
  - aiocqhttp
